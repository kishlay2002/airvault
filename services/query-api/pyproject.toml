[project]
name = "vaultmind-query-api"
version = "0.1.0"
description = "VaultMind Query API with MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "bcrypt>=4.1.0",
    "mcp>=1.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
