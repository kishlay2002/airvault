[project]
name = "vaultmind-ingestion-worker"
version = "0.1.0"
description = "VaultMind document ingestion worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "faster-whisper>=1.0.0",
    "chardet>=5.2.0",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
