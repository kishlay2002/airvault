[project]
name = "airvault"
version = "0.1.1"
description = "AirVault — Air-Gapped Document Intelligence SDK with compliance-aware access control"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kishlay Kashish"}]
keywords = ["rag", "document-intelligence", "vector-search", "air-gapped", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "chardet>=5.2.0",
    "structlog>=24.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0.0"]
server = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "redis>=5.0.0",
    "bcrypt>=4.1.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
]
mcp = ["mcp>=1.0.0"]
worker = ["arq>=0.26.0", "redis>=5.0.0"]
all = ["airvault[audio,server,mcp,worker]"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
airvault = "airvault.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
